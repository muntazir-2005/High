name: Build iOS Tweak (theos-jailed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # يدوي

jobs:
  build:
    runs-on: macos-latest  # macOS مطلوب لأن البناء يحتاج Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (theos, ldid, etc.)
        run: |
          # تثبيت homebrew إذا لم يكن موجودًا (macOS runner فيه مسبقًا)
          brew install ldid
          brew install dpkg
          brew install git

      - name: Setup theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --depth=1 https://github.com/theos/theos.git $THEOS
          sudo chown -R $USER $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Setup theos-jailed (for no-jailbreak tweaks)
        run: |
          export THEOS_JAILED=1
          echo "THEOS_JAILED=1" >> $GITHUB_ENV
          # تحميل مكتبة iOSRE_Framework_Private (مطلوبة لبعض الهوكات)
          git clone https://github.com/kabiroberai/iOSRE_Framework_Private.git $THEOS/vendor/iOSRE_Framework_Private || true

      - name: Build tweak (make package)
        run: |
          make package FINALPACKAGE=1
          # سيتم إنشاء ملف .deb و .ipa في مجلد packages/

      - name: List build artifacts
        run: |
          find . -name "*.deb" -o -name "*.ipa" -o -name "*.dylib" | head -20

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
          retention-days: 30

      - name: Upload .ipa artifact (if generated)
        uses: actions/upload-artifact@v4
        with:
          name: tweak-ipa
          path: packages/*.ipa
          retention-days: 30
