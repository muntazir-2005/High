name: Build Ultimate Hook for macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: macos-latest  # macOS latest (Intel or Apple Silicon)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        echo "Building on macOS version:"
        sw_vers
        echo "Xcode version:"
        xcodebuild -version
        echo "Clang version:"
        clang++ --version

    - name: Create build directory
      run: mkdir -p build

    - name: Compile hook library
      run: make all

    - name: Sign library (ad-hoc)
      run: |
        # Create temporary entitlements
        cat > entitlements.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
        </dict>
        </plist>
        EOF
        codesign -f -s - --entitlements entitlements.plist ultimate_hook.dylib
        codesign -vvv ultimate_hook.dylib

    - name: Run basic test
      run: make test

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultimate_hook_dylib
        path: ultimate_hook.dylib
        retention-days: 30

    - name: Upload debug symbols (optional)
      uses: actions/upload-artifact@v4
      with:
        name: hook_symbols
        path: |
          ultimate_hook.dylib
          build/hook.o
        retention-days: 7

  # Optional: Test on different macOS versions (using matrix)
  test-compatibility:
    runs-on: macos-latest
    needs: build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ultimate_hook_dylib
    - name: Verify architecture
      run: |
        file ultimate_hook.dylib
        lipo -info ultimate_hook.dylib || true
